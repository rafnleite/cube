cubes:
  - title: Aeroportos chegada
    name: airports_arrival
    sql_table: bookings.airports
    data_source: default

    dimensions:
      - title: Código do aeroporto
        name: airport_code
        sql: airport_code
        type: string
        primary_key: true

      - title: Nome
        name: airport_name
        sql: airport_name
        type: string

      - title: Cidade
        name: city
        sql: city
        type: string

      - title: País
        name: country
        sql: country
        type: string

      - title: Fuso horário
        name: timezone
        sql: timezone
        type: string

      - title: Coordenadas
        name: coordinates
        type: geo
        latitude:
          sql: ({CUBE}.coordinates)[1]

        longitude:
          sql: ({CUBE}.coordinates)[0]

    measures:
      - title: Contagem
        name: count
        type: count
        drill_members: []

    hierarchies:
      - title: Localização
        name: location
        levels:
          - country
          - city
          - airport_code

  - title: Aeroportos partida
    name: airports_departure
    sql_table: bookings.airports
    data_source: default

    dimensions:
      - title: Código do aeroporto
        name: airport_code
        sql: airport_code
        type: string
        primary_key: true

      - title: Nome
        name: airport_name
        sql: airport_name
        type: string

      - title: Cidade
        name: city
        sql: city
        type: string

      - title: País
        name: country
        sql: country
        type: string

      - title: Fuso horário
        name: timezone
        sql: timezone
        type: string

      - title: Coordenadas
        name: coordinates
        type: geo
        latitude:
          sql: ({CUBE}.coordinates)[1]

        longitude:
          sql: ({CUBE}.coordinates)[0]

    measures:
      - title: Contagem
        name: count
        type: count
        drill_members: []

    hierarchies:
      - name: location
        title: Localização
        levels:
          - country
          - city
          - airport_code
