cubes:
  - title: Cartões de embarque
    name: boarding_passes
    sql_table: bookings.boarding_passes
    data_source: default

    dimensions:
      - title: ID do segmento
        name: segment_id
        sql: CONCAT({CUBE}.ticket_no, '-', {CUBE}.flight_id)
        type: string
        primary_key: true
        shown: false
      - name: flight_id
        title: ID do avião
        type: number
        sql: "{CUBE}.flight_id"
      - name: boarding_no
        title: Número de embarque
        type: number
        sql: "{CUBE}.boarding_no"

      - title: Número do assento
        name: seat_no
        sql: seat_no
        type: string

      - title: Número do bilhete
        name: ticket_no
        sql: ticket_no
        type: string

      - title: Horário de embarque
        name: boarding_time
        sql: boarding_time
        type: time

    measures:
      - title: Contagem
        name: count
        type: count
        drill_members: []
