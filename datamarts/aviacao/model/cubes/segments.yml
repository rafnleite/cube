cubes:
  - title: Segmentos
    name: segments
    sql_table: bookings.segments
    data_source: default

    joins:
      - name: boarding_passes
        sql: '{CUBE}.ticket_no = {boarding_passes}.ticket_no AND {CUBE}.flight_id =
          {boarding_passes}.flight_id'
        relationship: one_to_one

      - name: timetable
        sql: '{CUBE}.flight_id = {timetable}.flight_id'
        relationship: many_to_one
      - name: tickets
        sql: "{CUBE}.ticket_no = {tickets}.ticket_no"
        relationship: many_to_one

    dimensions:
      - title: ID do segmento
        name: segment_id
        sql: CONCAT({CUBE}.ticket_no, '-', {CUBE}.flight_id)
        type: string
        primary_key: true

      - title: ID do voo
        name: flight_id
        sql: '{CUBE}.flight_id'
        type: number

      - title: Condições de tarifa
        name: fare_conditions
        sql: fare_conditions
        type: string

      - title: Preço
        name: price
        sql: price
        type: number

      - title: Número do bilhete
        name: ticket_no
        sql: ticket_no
        type: string

    measures:
      - title: Contagem
        name: count
        type: count
        drill_members: []

      - title: Preço total
        name: total_price
        sql: '{CUBE}.price'
        type: sum
        drill_members: []

      - title: Preço médio
        name: avg_price
        sql: '{CUBE}.price'
        type: avg
        drill_members: []
