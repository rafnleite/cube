      - name: nr_celular
        sql: "{CUBE}.\"NR_CELULAR\""
        type: string

      - name: ds_email
        sql: "{CUBE}.\"DS_EMAIL\""
        type: string

      - name: nm_logradouro
        sql: "{CUBE}.\"NM_LOGRADOURO\""
        type: string

      - name: ds_endereco_complemento
        sql: "{CUBE}.\"DS_ENDERECO_COMPLEMENTO\""
        type: string

      - name: nr_endereco
        sql: "{CUBE}.\"NR_ENDERECO\""
        type: string

      - name: nm_bairro
        sql: "{CUBE}.\"NM_BAIRRO\""
        type: string

      - name: dt_alteracao
        sql: "{CUBE}.\"DT_ALTERACAO\""
        type: time

      - name: dt_inclusao
        sql: "{CUBE}.\"DT_INCLUSAO\""
        type: time

      - name: dt_carga_dados
        sql: "{CUBE}.\"DT_CARGA_DADOS\""
        type: time

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
