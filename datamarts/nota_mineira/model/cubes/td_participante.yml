cubes:
  - name: td_participante
    sql_table: "\"NOTA_MINEIRA_ARM\".\"TD_PARTICIPANTE\""
    data_source: default

    joins: []

    dimensions:
      - name: id_participante
        sql: "{CUBE}.\"ID_PARTICIPANTE\""
        type: string

      - name: nm_participante
        sql: "{CUBE}.\"NM_PARTICIPANTE\""
        type: string

      - name: fl_mobile
        sql: "{CUBE}.\"FL_MOBILE\""
