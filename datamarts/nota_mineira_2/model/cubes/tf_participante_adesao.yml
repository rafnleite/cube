cubes:
  - name: tf_participante_adesao
    sql_table: "\"NOTA_MINEIRA_ARM\".\"TF_PARTICIPANTE_ADESAO\""
    data_source: default

    joins:
      - name: td_municipio
        sql: "{CUBE}.sk_municipio = {td_municipio}.sk_municipio"
        relationship: many_to_one

      - name: td_participante
        sql: "{CUBE}.sk_participante = {td_participante}.sk_participante"
        relationship: many_to_one

      - name: td_regiao_fiscal
        sql: "{CUBE}.sk_regiao_fiscal = {td_regiao_fiscal}.sk_regiao_fiscal"
        relationship: many_to_one

      - name: td_periodo
        sql: "{CUBE}.SK_DT_ADESAO = {td_periodo}.data"
        relationship: many_to_one

    dimensions:
      - name: id
        title: ID
        sql: COALESCE({CUBE}."SK_DT_ADESAO" || '', '') || '-' ||
          COALESCE({CUBE}."SK_MUNICIPIO" || '', '') || '-' ||
          COALESCE({CUBE}."SK_PARTICIPANTE" || '', '') || '-' ||
          COALESCE({CUBE}."SK_REGIAO_FISCAL" || '', '')

        type: string
        primary_key: true

      - name: sk_municipio
        sql: '{CUBE}."SK_MUNICIPIO"'
        type: number
        primary_key: false

      - name: sk_participante
        sql: '{CUBE}."SK_PARTICIPANTE"'
        type: number
        primary_key: false

      - name: sk_regiao_fiscal
        sql: '{CUBE}."SK_REGIAO_FISCAL"'
        type: number
        primary_key: false

      - name: sk_dt_adesao
        sql: '{CUBE}."SK_DT_ADESAO"'
        type: time
        primary_key: false

      - name: dt_inicio_adesao
        title: Data início de adesão
        sql: '{CUBE}."DT_INICIO_ADESAO"'
        type: time
        primary_key: false

      - name: dt_fim_adesao
        title: Data fim de adesão
        sql: '{CUBE}."DT_FIM_ADESAO"'
        type: time
        primary_key: false

      - name: fl_part_ativo
        title: Flag - Paricipante ativo
        sql: '{CUBE}."FL_PART_ATIVO"'
        type: number
        primary_key: false

      - name: fl_part_impedido
        title: Flag - Participante impedido
        sql: '{CUBE}."FL_PART_IMPEDIDO"'
        type: number
        primary_key: false

    measures:
      - name: count
        title: Contagem
        type: count

      - name: qtd_participante
        title: Quantidade participante
        sql: '{CUBE}."QTD_PARTICIPANTE"'
        type: sum

      - name: count_actives
        title: Contagem ativos
        type: count
        drill_members: []
        filters:
          - sql: "{CUBE}.FL_PART_ATIVO = 1"

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

    title: Fato - Participante adesão
    hierarchies: []
