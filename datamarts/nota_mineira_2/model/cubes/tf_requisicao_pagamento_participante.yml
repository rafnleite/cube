cubes:
  - name: tf_requisicao_pagamento_participante
    sql_table: "\"NOTA_MINEIRA_ARM\".\"TF_REQUISICAO_PAGAMENTO_PARTICIPANTE\""
    data_source: default

    joins:
      - name: tf_premiacoes_participantes
        sql: "{CUBE}.SK_PREMIADO = {tf_premiacoes_participantes}.SK_PREMIADO"
        relationship: many_to_one

    dimensions:
      - name: id
        title: ID
        sql: COALESCE({CUBE}."SK_PREMIADO" || '', '') || '-' ||
          COALESCE({CUBE}."SK_STATUS_RETORNO_PAGAMENTO" || '', '')

        type: string
        primary_key: true

      - name: sk_premiado
        sql: '{CUBE}."SK_PREMIADO"'
        type: number
        primary_key: false

      - name: sk_status_retorno_pagamento
        sql: '{CUBE}."SK_STATUS_RETORNO_PAGAMENTO"'
        type: number
        primary_key: false

      - name: dt_requisicao
        title: Data requisição
        sql: '{CUBE}."DT_REQUISICAO"'
        type: time
        primary_key: false

      - name: dt_retorno_proc_pag_grp
        title: Data retorno
        sql: '{CUBE}."DT_RETORNO_PROC_PAG_GRP"'
        type: time
        primary_key: false

      - name: sq_requisicao_pagam_premio
        title: SQ Requisição de pagamento do prêmio
        sql: "{CUBE}.SQ_REQUISICAO_PAGAM_PREMIO"
        type: number
        primary_key: false

    measures:
      - name: count
        title: Contagem
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

    title: Fato - Requisicão de pagamento - Participante
    hierarchies: []
