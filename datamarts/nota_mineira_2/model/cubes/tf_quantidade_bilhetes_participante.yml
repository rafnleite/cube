cubes:
  - name: tf_quantidade_bilhetes_participante
    sql_table: "\"NOTA_MINEIRA_ARM\".\"TF_QUANTIDADE_BILHETES_PARTICIPANTE\""
    data_source: default

    joins:
      - name: td_bilhetagem
        sql: "{CUBE}.sk_bilhetagem = {td_bilhetagem}.sk_bilhetagem"
        relationship: many_to_one

      - name: td_periodo
        sql: "{CUBE}.dt_bilhetagem = {td_periodo}.data"
        relationship: many_to_one

      - name: td_participante
        sql: "{CUBE}.sk_participante = {td_participante}.sk_participante"
        relationship: many_to_one

      - name: td_municipio
        sql: "{CUBE}.sk_municipio = {td_municipio}.sk_municipio"
        relationship: many_to_one

      - name: td_regiao_fiscal
        sql: "{CUBE}.sk_regiao_fiscal = {td_regiao_fiscal}.sk_regiao_fiscal"
        relationship: many_to_one

    dimensions:
      - name: id
        title: ID
        sql: COALESCE({CUBE}."SK_BILHETAGEM" || '', '') || '-' ||
          COALESCE({CUBE}."SK_PARTICIPANTE" || '', '') || '-' ||
          COALESCE({CUBE}."SK_MUNICIPIO" || '', '') || '-' ||
          COALESCE({CUBE}."SK_REGIAO_FISCAL" || '', '')

        type: string
        primary_key: true

      - name: sk_bilhetagem
        sql: '{CUBE}."SK_BILHETAGEM"'
        type: number
        primary_key: false

      - name: sk_participante
        sql: '{CUBE}."SK_PARTICIPANTE"'
        type: number
        primary_key: false

      - name: sk_municipio
        sql: '{CUBE}."SK_MUNICIPIO"'
        type: number
        primary_key: false

      - name: sk_regiao_fiscal
        sql: '{CUBE}."SK_REGIAO_FISCAL"'
        type: number
        primary_key: false

      - name: dt_bilhetagem
        sql: '{CUBE}."DT_BILHETAGEM"'
        type: time
        primary_key: false

    measures:
      - name: count
        title: Contagem
        type: count

      - name: qtd_bilhetes
        title: Quantidade de bilhetes
        sql: '{CUBE}."QTD_BILHETES"'
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

    title: Fato - Bilhetes por participante
    hierarchies: []
