cubes:
  - name: segments
    sql_table: bookings.segments
    data_source: default
    joins:
      - name: flights
        sql: '{CUBE}.flight_id = {flights}.flight_id'
        relationship: many_to_one
    dimensions:
      - name: id
        sql: CONCAT({CUBE}.ticket_no, '-', {CUBE}.flight_id)
        type: string
        primary_key: true
      - name: fare_conditions
        sql: fare_conditions
        type: string
        title: Condições de tarifa
      - name: price
        sql: price
        type: string
        title: Preço
      - name: ticket_no
        sql: ticket_no
        type: string
        title: Número do bilhete
      - name: flight_id
        sql: flight_id
        type: string
    measures:
      - name: count
        type: count
    title: Segmentos
