cubes:
  - title: Reserva
    name: bookings
    sql_table: bookings.bookings
    data_source: default

    joins:
      - name: tickets
        sql: '{CUBE}.book_ref = {tickets}.book_ref'
        relationship: one_to_many

    dimensions:
      - title: Referência
        name: book_ref
        sql: book_ref
        type: string
        primary_key: true

      - title: Data de reserva
        name: book_date
        sql: book_date
        type: time

    measures:
      - name: count
        type: count

      - title: Valor total
        name: total_amount
        sql: '{CUBE}.total_amount'
        type: sum
        drill_members: []

      - title: Valor médio
        name: avg_amount
        sql: '{CUBE}.total_amount'
        type: avg
