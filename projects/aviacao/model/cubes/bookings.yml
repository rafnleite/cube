cubes:
  - name: bookings
    sql_table: bookings.bookings
    data_source: default
    dimensions:
      - name: book_ref
        sql: book_ref
        type: string
        title: Referência
        primary_key: true
      - name: total_amount
        sql: total_amount
        type: string
      - name: book_date
        sql: book_date
        type: time
        title: Data de reserva
    measures:
      - name: count
        type: count
    title: Reserva
    joins:
      - name: tickets
        sql: "{CUBE}.book_ref = {tickets}.book_ref"
        relationship: one_to_many
