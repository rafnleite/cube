cubes:
  - name: boarding_passes
    title: Cartões de embarque
    sql_table: bookings.boarding_passes
    data_source: default
    joins:
      - name: flights
        sql: '{CUBE}.flight_id = {flights}.flight_id'
        relationship: many_to_one
    dimensions:
      - name: id
        sql: CONCAT({CUBE}.ticket_no, '-', {CUBE}.flight_id)
        type: string
        primary_key: true
        shown: false
      - name: seat_no
        sql: seat_no
        type: string
        title: Número do assento
      - name: ticket_no
        sql: ticket_no
        type: string
        title: Número do bilhete
      - name: flight_id
        sql: flight_id
        type: string
      - name: boarding_time
        sql: boarding_time
        type: time
        title: Horário de embarque
    measures:
      - name: count
        type: count
