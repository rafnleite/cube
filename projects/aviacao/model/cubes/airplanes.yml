cubes:
  - title: Aviões
    name: airplanes
    sql_table: bookings.airplanes
    data_source: default

    joins:
      - name: seats
        sql: '{CUBE}.airplane_code = {seats}.airplane_code'
        relationship: one_to_many

    dimensions:
      - title: Código
        name: airplane_code
        sql: airplane_code
        type: string
        primary_key: true

      - title: Modelo
        name: model
        sql: model
        type: string

    measures:
      - name: count
        type: count
