cubes:
  - title: Aeroportos chegada
    name: airports_arrival
    sql_table: bookings.airports
    data_source: default

    dimensions:
      - title: Código do aeroporto
        name: airport_code
        sql: airport_code
        type: string
        primary_key: true

      - title: Nome
        name: airport_name
        sql: airport_name
        type: string

      - title: Cidade
        name: city
        sql: city
        type: string

      - title: País
        name: country
        sql: country
        type: string

      - title: Fuso horário
        name: timezone
        sql: timezone
        type: string

      - title: Coordenadas
        name: coordinates
        type: geo
        latitude:
          sql: ({CUBE}.coordinates)[1]

        longitude:
          sql: ({CUBE}.coordinates)[0]

    measures:
      - name: count
        type: count
