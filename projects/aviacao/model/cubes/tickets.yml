cubes:
  - title: Bilhetes
    name: tickets
    sql_table: bookings.tickets
    data_source: default

    joins:
      - name: segments
        sql: '{CUBE}.ticket_no = {segments}.ticket_no'
        relationship: one_to_many

    dimensions:
      - title: Número do bilhete
        name: ticket_no
        sql: ticket_no
        type: string
        primary_key: true

      - title: Referência de reserva
        name: book_ref
        sql: book_ref
        type: string

      - title: Ida
        name: outbound
        sql: outbound
        type: boolean

      - title: ID do passageiro
        name: passenger_id
        sql: passenger_id
        type: string

      - title: Nome do passageiro
        name: passenger_name
        sql: passenger_name
        type: string

    measures:
      - name: count
        type: count
