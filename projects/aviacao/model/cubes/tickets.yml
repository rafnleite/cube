cubes:
  - name: tickets
    sql_table: bookings.tickets
    data_source: default
    dimensions:
      - name: book_ref
        sql: book_ref
        type: string
        title: Referência de reserva
      - name: outbound
        sql: outbound
        type: boolean
      - name: passenger_id
        sql: passenger_id
        type: string
        title: ID do passageiro
      - name: passenger_name
        sql: passenger_name
        type: string
        title: Nome do passageiro
      - name: ticket_no
        sql: ticket_no
        type: string
        primary_key: true
        title: Número do bilhete
    measures:
      - name: count
        type: count
    title: Bilhetes
